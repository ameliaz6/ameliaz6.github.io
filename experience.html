<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work Experience - Amelia Zacharska</title>
<style>
:root {
  --pink-bg: #faf6f8;
  --pink-strong: #d57baa;
  --text-dark: #5a4a52;
  --card-bg: #ffffff;
  --shadow: 0 8px 20px rgba(0,0,0,0.05);
  --button-bg: #f9c7e1;
  --button-hover: #e7a7c5;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--pink-bg);
  color: var(--text-dark);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  flex-direction: column;
  text-align: center;
}
h1 {
  font-size: 2.8rem;
  margin-bottom: 10px;
  color: var(--pink-strong);
}
p {
  font-size: 1.2rem;
  margin-bottom: 30px;
}
.section-card {
  background: var(--card-bg);
  padding: 30px;
  border-radius: 20px;
  box-shadow: var(--shadow);
  max-width: 700px;
  width: 90%;
  margin-bottom: 20px;
  text-align: left;
}
.button {
  background: var(--button-bg);
  color: var(--text-dark);
  border: none;
  padding: 12px 25px;
  border-radius: 15px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: var(--shadow);
  text-decoration: none;
  display: inline-block;
  transition: transform 0.2s, background 0.3s;
}
.button:hover {
  background: var(--button-hover);
  transform: translateY(-3px);
}
</style>
</head>
<body>

<h1>Work Experience</h1>

<div class="section-card">
  <h2>Experience</h2>
  <p>No formal work experience yet, but I have completed several coding projects, school assignments, and self-led learning that demonstrate initiative, problem-solving skills, and a strong work ethic.</p>
</div>

<a href="index.html" class="button">← Back to Home</a>

</body>
</html>
