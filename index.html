<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amelia Zacharska | Portfolio</title>
<style>
:root {
  --pink-bg: #faf6f8;
  --pink-strong: #d57baa;
  --text-dark: #5a4a52;
  --button-bg: #f9c7e1;
  --button-hover: #e7a7c5;
  --shadow: 0 8px 20px rgba(0,0,0,0.05);
}

body {
  margin: 0;
  font-family: Century Gothic, sans-serif;
  background: var(--pink-bg);
  color: var(--text-dark);
  line-height: 1.6;
}

/* Header with photo and name/title */
header {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 20px 40px;
  gap: 20px;
}

header img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--pink-strong);
  box-shadow: var(--shadow);
}

header .header-text {
  display: flex;
  flex-direction: column;
}

header h1 {
  margin: 0;
  font-size: 2.5rem;
  color: var(--pink-strong);
}

header p {
  margin: 5px 0 0 0;
  font-size: 1.2rem;
  color: #7b6d74;
}

/* Horizontal line */
hr {
  border: none;
  height: 2px;
  background: var(--pink-strong);
  margin: 20px 40px;
  border-radius: 2px;
}

/* Main content */
.main-content {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 20px 40px 20px;
  text-align: center;
}

.button-group {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 20px;
}

.button {
  background: var(--button-bg);
  color: var(--text-dark);
  border: none;
  padding: 12px 25px;
  border-radius: 15px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: var(--shadow);
  text-decoration: none;
  transition: transform 0.2s, background 0.3s;
}

.button:hover {
  background: var(--button-hover);
  transform: translateY(-3px);
}

/* Responsive */
@media (max-width: 600px) {
  header {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  header img {
    width: 100px;
    height: 100px;
  }

  header h1 {
    font-size: 2rem;
  }

  header p {
    font-size: 1rem;
  }
}
</style>
</head>
<body>

<header>
  <img src="selfie.jpg" alt="Amelia Zacharska">
  <div class="header-text">
    <h1>Amelia Zacharska</h1>
    <p>Aspiring Software Engineer Apprentice</p>
  </div>
</header>

<hr>

<div class="main-content">
  <p>A-Level Student at Our Lady's Grammar School Newry. Passionate about coding and learning!</p>

  <div class="button-group">
    <a href="qualifications.html" class="button">Qualifications</a>
    <a href="experience.html" class="button">Work Experience</a>
    <a href="interests.html" class="button">Interests</a>
  </div>
</div>

</body>
</html>
